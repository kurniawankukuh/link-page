<style>
/* Liquid glass: latar mesh gradien berwarna, panel kaca buram dengan sorot specular, sidebar mengambang. */
:root{
  --bg0:#e8eefb; --b1:#79a6ff; --b2:#7fe0d2; --b3:#c4a3ff; --b4:#ffc7a1; --blob-o:.62;
  --glass:rgba(255,255,255,.50); --glass-2:rgba(255,255,255,.68); --glass-in:rgba(255,255,255,.62);
  --edge:rgba(255,255,255,.85); --edge-dim:rgba(255,255,255,.30); --gloss:.55;
  --shadow:0 14px 38px rgba(38,58,120,.16);
  --fg:#12233a; --muted:#475b73; --line:rgba(18,35,58,.11);
  --accent:#2d6cf5; --accent-2:#14a3d8; --accent-fg:#ffffff; --accent-soft:rgba(45,108,245,.14);
  --bar-top:#8fb8ff; --bar-bot:#4f86ee; --bar-sel-top:#3b7bff; --bar-sel-bot:#1d4fc4;
  --ok-bg:rgba(30,170,100,.17); --ok-fg:#0d6a3a; --bad-bg:rgba(236,64,64,.15); --bad-fg:#a91f19;
  --warn-bg:rgba(240,170,30,.20); --warn-fg:#7a4f00; --focus:#2d6cf5;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg0:#0a0f1f; --b1:#2a55f0; --b2:#0ea89b; --b3:#7a3fe0; --b4:#d9573f; --blob-o:.52;
  --glass:rgba(26,38,68,.46); --glass-2:rgba(34,48,84,.62); --glass-in:rgba(255,255,255,.08);
  --edge:rgba(255,255,255,.24); --edge-dim:rgba(255,255,255,.05); --gloss:.16;
  --shadow:0 16px 44px rgba(0,0,0,.5);
  --fg:#e9f0fc; --muted:#a0b2ca; --line:rgba(255,255,255,.11);
  --accent:#5b98ff; --accent-2:#35c3f0; --accent-fg:#06142d; --accent-soft:rgba(91,152,255,.2);
  --bar-top:#4a78c9; --bar-bot:#2c4f8e; --bar-sel-top:#7fb6ff; --bar-sel-bot:#4a86e8;
  --ok-bg:rgba(60,200,130,.18); --ok-fg:#7ee3ab; --bad-bg:rgba(255,100,100,.18); --bad-fg:#ffa39d;
  --warn-bg:rgba(255,190,60,.18); --warn-fg:#ffd27a; --focus:#7fb6ff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg0:#0a0f1f; --b1:#2a55f0; --b2:#0ea89b; --b3:#7a3fe0; --b4:#d9573f; --blob-o:.52;
  --glass:rgba(26,38,68,.46); --glass-2:rgba(34,48,84,.62); --glass-in:rgba(255,255,255,.08);
  --edge:rgba(255,255,255,.24); --edge-dim:rgba(255,255,255,.05); --gloss:.16;
  --shadow:0 16px 44px rgba(0,0,0,.5);
  --fg:#e9f0fc; --muted:#a0b2ca; --line:rgba(255,255,255,.11);
  --accent:#5b98ff; --accent-2:#35c3f0; --accent-fg:#06142d; --accent-soft:rgba(91,152,255,.2);
  --bar-top:#4a78c9; --bar-bot:#2c4f8e; --bar-sel-top:#7fb6ff; --bar-sel-bot:#4a86e8;
  --ok-bg:rgba(60,200,130,.18); --ok-fg:#7ee3ab; --bad-bg:rgba(255,100,100,.18); --bad-fg:#ffa39d;
  --warn-bg:rgba(255,190,60,.18); --warn-fg:#ffd27a; --focus:#7fb6ff; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg0);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--muted);white-space:normal;max-width:240px;line-height:1.35;margin-top:1px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted)}
td.wrap{white-space:normal;min-width:220px;max-width:340px}
.form .span3{grid-column:1/-1}

/* latar mesh */
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.mesh i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-o)}
.mesh i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-10vw;background:var(--b1)}
.mesh i:nth-child(2){width:40vw;height:40vw;right:-6vw;top:8vh;background:var(--b3)}
.mesh i:nth-child(3){width:44vw;height:44vw;left:22vw;bottom:-18vw;background:var(--b2)}
.mesh i:nth-child(4){width:30vw;height:30vw;right:6vw;bottom:-8vw;background:var(--b4)}
@media (prefers-reduced-motion:no-preference){
  .mesh i:nth-child(1){animation:drift1 26s ease-in-out infinite alternate}
  .mesh i:nth-child(3){animation:drift2 32s ease-in-out infinite alternate}
}
@keyframes drift1{to{transform:translate(6vw,5vh)}}
@keyframes drift2{to{transform:translate(-7vw,-4vh)}}

/* permukaan kaca */
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);
  border:1px solid var(--edge);border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge-dim)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(140deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 70%,rgba(255,255,255,.22) 100%);opacity:var(--gloss)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-2)}}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login{width:100%;max-width:392px;padding:30px 28px}
.badge{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--accent-2),var(--accent));color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 18px rgba(45,108,245,.35)}
.login h1{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.login .sub{color:var(--muted);font-size:13px;margin:6px 0 16px}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 5px;color:var(--muted)}
.in{width:100%;height:40px;border:1px solid var(--edge);background:var(--glass-in);border-radius:12px;padding:0 12px;font-size:13px;box-shadow:inset 0 1px 3px rgba(18,35,58,.08)}
textarea.in{height:auto;padding:10px 12px;min-height:110px;resize:vertical}
.in::placeholder{color:var(--muted);opacity:.65}
.pw{position:relative}
.pw .eye{position:absolute;right:5px;top:4px;width:32px;height:32px;border:0;background:none;cursor:pointer;color:var(--muted);border-radius:9px;display:grid;place-items:center}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{height:40px;border:1px solid var(--edge);border-radius:999px;padding:0 18px;font-weight:600;font-size:13px;cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));color:var(--accent-fg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px rgba(45,108,245,.28);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{filter:brightness(1.07)}
.btn.block{width:100%;margin-top:18px}
.btn.soft{background:var(--glass-in);color:var(--fg);box-shadow:inset 0 1px 0 var(--edge),0 2px 8px rgba(18,35,58,.08)}
.btn.danger{background:var(--bad-bg);color:var(--bad-fg);box-shadow:none}
.btn.sm{height:32px;padding:0 13px;font-size:12px}
.demo{margin-top:16px;background:var(--glass-in);border:1px solid var(--edge-dim);border-radius:14px;padding:11px 13px;font-size:11.5px;color:var(--muted)}
.demo b{color:var(--fg)}
.err{margin-top:12px;background:var(--bad-bg);color:var(--bad-fg);border-radius:12px;padding:10px 13px;font-size:12.5px}
.themebtn{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:5}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{margin:14px 0 14px max(14px,env(safe-area-inset-left,0px));padding:20px 12px 14px;display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100vh - 28px);align-self:start}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand .badge{width:36px;height:36px;border-radius:12px;font-size:11px;margin:0}
.brand b{display:block;font-size:14px;letter-spacing:-.01em}
.brand small{display:block;font-size:10.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:22px}
.nav button{background:none;border:1px solid transparent;color:inherit;text-align:left;padding:10px 12px;border-radius:14px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px;color:var(--muted)}
.nav button:hover{background:var(--glass-in)}
.nav button[aria-current="page"]{background:var(--glass-2);border-color:var(--edge);color:var(--fg);font-weight:600;box-shadow:inset 0 1px 0 var(--edge),0 4px 12px rgba(18,35,58,.1)}
.nav button[aria-current="page"] .ic{color:var(--accent)}
.sidefoot{margin-top:auto;display:grid;gap:8px}
.main{padding:18px max(18px,env(safe-area-inset-right,0px)) 40px 20px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.who{padding:7px 15px;font-size:11.5px;color:var(--muted);border-radius:999px}
.who b{color:var(--fg)}
.card{padding:18px 20px;min-width:0}
.card+.card{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpis>.card{margin-top:0;padding:15px 18px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:25px;font-weight:700;margin:4px 0 2px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .s{font-size:10.5px;color:var(--muted)}
.delta{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:0}
.delta.up{background:var(--ok-bg);color:var(--ok-fg)}
.delta.down{background:var(--bad-bg);color:var(--bad-fg)}
.delta.flat{background:var(--glass-in);color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:16px}
.cols>.card{margin-top:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.head h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.head .note{font-size:11px;color:var(--muted)}
.sel{height:38px;border:1px solid var(--edge);border-radius:999px;background:var(--glass-in);padding:0 14px;font-size:13px;max-width:100%;box-shadow:inset 0 1px 0 var(--edge)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass-in);border:1px solid var(--edge-dim)}
.seg button{border:0;background:none;height:30px;padding:0 13px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--fg);box-shadow:inset 0 1px 0 var(--edge),0 2px 8px rgba(18,35,58,.12)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font)}
.chart .val{fill:var(--fg);font-size:10.5px;font-weight:600}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .tl{stroke:var(--accent-2);stroke-width:1.3;stroke-dasharray:5 4}
.chart .tt{fill:var(--accent-2);font-size:10px;font-weight:600}
.cnote{font-size:11px;color:var(--muted);margin-top:6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--glass-in);text-align:left;font-size:11.5px;font-weight:700;padding:10px 11px;white-space:nowrap;color:var(--muted)}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
th .sb{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
th .sb[data-on="1"]{color:var(--accent)}
td{padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.pos{color:var(--ok-fg);font-weight:600}.neg{color:var(--bad-fg);font-weight:600}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg)}
.chip.bad{background:var(--bad-bg);color:var(--bad-fg)}
.banner{background:var(--accent-soft);color:var(--fg);border-radius:14px;padding:10px 14px;font-size:12px;margin-bottom:6px}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.form .act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.preview{grid-column:1/-1;margin-top:14px;padding:11px 14px;border-radius:14px;background:var(--glass-in);border:1px dashed var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.preview b{color:var(--fg)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px;display:grid;gap:6px}
.dec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dec>div{background:var(--glass-in);border:1px solid var(--edge-dim);border-radius:18px;padding:14px 16px}
.dec h3{font-size:13px;font-weight:700;margin-bottom:4px}
.dec p{font-size:12px;color:var(--muted)}
.dec .rec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg)}
.dec .rec small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.prog{height:9px;border-radius:999px;background:var(--glass-in);border:1px solid var(--edge-dim);overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.prog.good i{background:linear-gradient(90deg,#3dd68c,#17a35f)}
.pl{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.pl b{color:var(--fg)}
.tgt+.tgt{margin-top:16px}
.ins{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.ins li{font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.ins li span{min-width:0}
.ins li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--accent)}
.ins li.warn::before{background:#f0a21b}
.ins li.good::before{background:#25b36a}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .in{height:38px;border-radius:999px;max-width:260px}
.copybox{width:100%;min-height:110px;margin-top:10px}
.qbar{display:flex;align-items:center;gap:10px;font-size:12.5px}
.qbar .prog{flex:1;margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:11px 18px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;margin:12px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));padding:12px 12px 8px}
  .nav{flex-direction:row;margin:0;order:3;width:100%;overflow-x:auto;gap:2px}
  .nav button{white-space:nowrap;padding:8px 12px}
  .sidefoot{margin:0 0 0 auto;display:flex}
  .main{padding:14px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .form,.dec{grid-template-columns:minmax(0,1fr)}
  .top h1{font-size:22px}
}
@media (max-width:420px){.kpis{grid-template-columns:minmax(0,1fr)}}
</style>

function seedVideos(){ S.videos = SEED.map((r,i)=>({id:i+1,name:r[0],per:r[1],views:r[2],wt:r[3],rpm:r[4],cost:r[5],vid:r[6],title:r[7]})); S.nextId = S.videos.length+1; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && Array.isArray(o.videos) && o.set && typeof o.set.ambang==='number'){ S.videos=o.videos; S.nextId=o.nextId||o.videos.length+1; S.set={...DEF_SET,...o.set}; }
      else seedVideos();
    } else seedVideos();
    const t=localStorage.getItem(TKEY); if(t==='light'||t==='dark') S.theme=t;
  }catch(e){ if(!S.videos.length) seedVideos(); }
  applyTheme();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({videos:S.videos,nextId:S.nextId,set:S.set})); }catch(e){} }
function applyTheme(){ const r=document.documentElement; if(S.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme); }
function cycleTheme(){ S.theme = S.theme==='auto'?'light':S.theme==='light'?'dark':'auto'; applyTheme(); try{ S.theme==='auto'?localStorage.removeItem(TKEY):localStorage.setItem(TKEY,S.theme); }catch(e){} render(); }

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const rp = n => (n<0?'-':'')+'Rp'+fmt(Math.abs(n));
const pct = r => r==null ? '–' : (Math.round(r*10)/10)+'%';
const jt = n => n>=1e9 ? (n/1e9).toFixed(2).replace('.',',')+' M' : (n/1e6).toFixed(n>=1e8?0:1).replace('.',',')+' jt';
const perLabel = p => { const [y,m]=p.split('-'); return MONTHS[+m-1]+' '+y; };
const dataUntil = () => { const ms=months(); if(!ms.length) return '–'; const [y,m]=ms[ms.length-1].split('-').map(Number); return new Date(y,m,0).getDate()+' '+MONTHS[m-1]+' '+y; };
const yLabel = y => { const ms=months().filter(m=>yOf(m)===y); return ms.length&&ms.length<12 ? ' ('+MSHORT[+ms[0].split('-')[1]-1]+'–'+MSHORT[+ms[ms.length-1].split('-')[1]-1]+')' : ''; };
const qOf = p => Math.floor((+p.split('-')[1]-1)/3)+1;
const yOf = p => p.split('-')[0];

function calc(v){
  const rev = Math.round(v.views*v.rpm/1000);
  const bep = rev>=v.cost, wt = v.wt>=S.set.ambang;
  return {rev, bep, wt, ok:bep||wt, gap:rev-v.cost};
}
function stat(list){
  let ok=0, rev=0, cost=0, views=0;
  for(const v of list){ const c=calc(v); if(c.ok) ok++; rev+=c.rev; cost+=v.cost; views+=v.views; }
  return {total:list.length, ok, bad:list.length-ok, rate:list.length?ok/list.length*100:null, rev, cost, views};
}
const inMonth = p => S.videos.filter(v=>v.per===p);
const inQuarter = (y,q) => S.videos.filter(v=>yOf(v.per)===y && qOf(v.per)===q);
const inYear = y => S.videos.filter(v=>yOf(v.per)===y);
const months = () => [...new Set(S.videos.map(v=>v.per))].sort();
const years = () => [...new Set(S.videos.map(v=>yOf(v.per)))].sort();
const quarters = () => [...new Set(S.videos.map(v=>yOf(v.per)+'-Q'+qOf(v.per)))].sort();
const qLabel = k => { const [y,q]=k.split('-Q'); return 'Triwulan '+q+' '+y; };

function ensureUi(){
  const ms=months(), ys=years(), qs=quarters();
  if(!ms.includes(S.ui.ePer)) S.ui.ePer = ms.includes('2026-03') ? '2026-03' : (ms[ms.length-1]||'');
  if(!ys.includes(S.ui.rYear)) S.ui.rYear = ys[0]||'';
  const rm = ms.filter(m=>yOf(m)===S.ui.rYear);
  if(!rm.includes(S.ui.rMonth)) S.ui.rMonth = rm[0]||'';
  const opts = S.ui.dType==='bulanan'?ms : S.ui.dType==='triwulan'?qs : ys;
  if(!opts.includes(S.ui.dPer)) S.ui.dPer = (S.ui.dType==='bulanan' && ms.includes('2026-03')) ? '2026-03' : (opts[0]||'');
}
function switchType(t){
  const old=S.ui.dPer; let y='2026', m=1;
  if(/^\d{4}-\d{2}$/.test(old)){ y=yOf(old); m=+old.split('-')[1]; }
  else if(/-Q\d$/.test(old)){ y=old.split('-Q')[0]; m=(+old.split('-Q')[1]-1)*3+1; }
  else if(/^\d{4}$/.test(old)){ y=old; }
  S.ui.dType=t;
  S.ui.dPer = t==='bulanan' ? y+'-'+String(m).padStart(2,'0') : t==='triwulan' ? y+'-Q'+(Math.floor((m-1)/3)+1) : y;
}
function dashList(){
  const p=S.ui.dPer, t=S.ui.dType;
  if(t==='bulanan') return inMonth(p);
  if(t==='triwulan'){ const [y,q]=p.split('-Q'); return inQuarter(y,+q); }
  return inYear(p);
}
function prevOf(t,p){
  if(t==='bulanan'){ const [y,m]=p.split('-').map(Number); const d=new Date(y,m-2,1); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); return {list:inMonth(k),label:perLabel(k)}; }
  if(t==='triwulan'){ let [y,q]=p.split('-Q').map(Number); q--; if(q<1){q=4;y--;} return {list:inQuarter(String(y),q),label:'Triwulan '+q+' '+y}; }
  const y=String(+p-1); return {list:inYear(y),label:y};
}
const scaleOf = t => t==='bulanan'?1:t==='triwulan'?3:12;
function deltaPts(cur,prev,label){
  if(cur==null||prev==null) return '';
  const d=Math.round((cur-prev)*10)/10;
  const cls=d>0?'up':d<0?'down':'flat';
  return `<span class="delta ${cls}" title="Dibanding ${esc(label)}">${d>0?'▲ ':d<0?'▼ ':''}${Math.abs(d)} poin</span>`;
}
function deltaPct(cur,prev,label){
  if(!prev) return '';
  const d=Math.round((cur-prev)/prev*1000)/10;
  const cls=d>0?'up':d<0?'down':'flat';
  return `<span class="delta ${cls}" title="Dibanding ${esc(label)}">${d>0?'▲ ':d<0?'▼ ':''}${Math.abs(d)}%</span>`;
}

const chip = ok => `<span class="chip ${ok?'ok':'bad'}">${ok?'Berhasil':'Tidak Berhasil'}</span>`;

/* ---------- dashboard ---------- */
function dashboard(){
  const list=dashList(), st=stat(list), t=S.ui.dType, p=S.ui.dPer;
  const ms=months(), qs=quarters(), ys=years();
  const prev=prevOf(t,p), ps=stat(prev.list), hasPrev=prev.list.length>0;
  const popts = t==='bulanan'? ms.map(m=>opt(m,perLabel(m),p)) : t==='triwulan'? qs.map(q=>opt(q,qLabel(q),p)) : ys.map(y=>opt(y,y,p));
  const latest = [...list].sort((a,b)=>b.id-a.id).slice(0,5);
  const kp=(l,v,s,d='')=>`<div class="card kpi glass"><div class="l">${l}</div><div class="v num">${v}${d}</div><div class="s">${s}</div></div>`;
  const sc=scaleOf(t), revT=S.set.revTarget*sc, rateT=S.set.rateTarget;
  const rp1=st.rate==null?0:st.rate/rateT*100, rp2=st.rev/revT*100;
  const bar=(label,val,tgt,p2,fmtv)=>`<div class="tgt"><div class="pl"><span>${label}</span><span><b class="num">${fmtv(val)}</b> dari target ${fmtv(tgt)}</span></div><div class="prog${p2>=100?' good':''}"><i style="width:${Math.max(0,Math.min(100,p2))}%"></i></div><div class="pl"><span>${p2>=100?'Target tercapai':'Kurang '+(val==null?'':t_gap(label,val,tgt,fmtv))}</span><b class="num">${Math.round(p2)}%</b></div></div>`;
  return `<section class="kpis">
    ${kp('Total Video',st.total,'Periode terpilih')}
    ${kp('Video Berhasil',st.ok,'BEP atau watch time tercapai')}
    ${kp('Video Tidak Berhasil',st.bad,'BEP dan watch time belum tercapai')}
    ${kp('Tingkat Keberhasilan',pct(st.rate),'Video berhasil / total video',hasPrev?deltaPts(st.rate,ps.rate,prev.label):'')}
    ${kp('Estimasi Pendapatan',rp(st.rev),'Berdasarkan Views × RPM',hasPrev?deltaPct(st.rev,ps.rev,prev.label):'')}
  </section>
  <div class="cols">
    <section class="card glass"><div class="head"><h2>Ringkasan Kinerja</h2><div class="row">
      <select class="sel" id="dType" data-sel="dType" aria-label="Jenis periode">${opt('bulanan','Bulanan',t)}${opt('triwulan','Triwulan',t)}${opt('tahunan','Tahunan',t)}</select>
      <select class="sel" id="dPer" data-sel="dPer" aria-label="Periode">${popts.join('')}</select></div></div>
      <div class="seg" role="group" aria-label="Metrik grafik"><button data-act="metric" data-m="rate" aria-pressed="${S.ui.metric==='rate'}">Tingkat Keberhasilan</button><button data-act="metric" data-m="rev" aria-pressed="${S.ui.metric==='rev'}">Pendapatan</button></div>
      ${chart()}
      <p class="cnote">Status berhasil mengikuti logika OR: mencapai BEP atau watch time minimal ${fmt(S.set.ambang)} menit. Garis putus-putus menunjukkan target.</p>
    </section>
    <section class="card glass"><div class="head"><h2>Video Terbaru</h2><button class="btn soft sm" data-act="nav" data-p="input">Tambah Data</button></div>
      ${latest.length?`<div class="tw"><table><thead><tr><th>Video</th><th>Pendapatan</th><th>Status</th></tr></thead><tbody>${latest.map(v=>{const c=calc(v);return `<tr><td>${esc(v.name)}<div class="sub">${esc(v.title||'')}</div></td><td class="num">${rp(c.rev)}</td><td>${chip(c.ok)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Belum ada video pada periode ini.</div>'}
    </section>
  </div>
  <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)">
    <section class="card glass"><div class="head"><h2>Capaian Target</h2>${S.user==='manager'?'<button class="btn soft sm" data-act="nav" data-p="target">Atur</button>':''}</div>
      ${list.length?`${bar('Tingkat keberhasilan',st.rate,rateT,rp1,v=>pct(v))}${bar('Pendapatan',st.rev,revT,rp2,v=>rp(v))}`:'<div class="empty">Belum ada data pada periode ini.</div>'}
    </section>
    <section class="card glass"><div class="head"><h2>Wawasan Otomatis</h2><span class="note">Dihitung dari data periode terpilih</span></div>
      <ul class="ins">${insights(list,st,prev,ps,hasPrev).map(i=>`<li class="${i[0]}"><span>${i[1]}</span></li>`).join('')}</ul>
    </section>
  </div>`;
}
function t_gap(label,val,tgt,fmtv){ return label==='Pendapatan' ? rp(Math.max(0,tgt-val)) : (Math.round(Math.max(0,tgt-val)*10)/10)+' poin'; }

function insights(list,st,prev,ps,hasPrev){
  if(!list.length) return [['','Belum ada data pada periode ini.']];
  const out=[], rateT=S.set.rateTarget;
  if(hasPrev && st.rate!=null && ps.rate!=null){
    const d=Math.round((st.rate-ps.rate)*10)/10;
    out.push([d>0?'good':d<0?'warn':'', d===0?`Tingkat keberhasilan sama dengan ${esc(prev.label)} (<b>${pct(st.rate)}</b>).`:`Tingkat keberhasilan <b>${d>0?'naik':'turun'} ${Math.abs(d)} poin</b> dibanding ${esc(prev.label)} (${pct(ps.rate)} menjadi ${pct(st.rate)}).`]);
  }
  out.push([st.rate>=rateT?'good':'warn', st.rate>=rateT?`Tingkat keberhasilan sudah di atas target ${rateT}%.`:`Tingkat keberhasilan masih <b>${Math.round((rateT-st.rate)*10)/10} poin</b> di bawah target ${rateT}%.`]);
  const byRev=[...list].map(v=>({v,c:calc(v)})).sort((a,b)=>b.c.rev-a.c.rev);
  const top=byRev[0], low=byRev[byRev.length-1];
  out.push(['',`Pendapatan tertinggi: <b>${esc(top.v.name)}</b> “${esc(top.v.title||'')}” (${rp(top.c.rev)}). Terendah: <b>${esc(low.v.name)}</b> “${esc(low.v.title||'')}” (${rp(low.c.rev)}).`]);
  out.push(['',`Rata-rata <b>${fmt(st.views/st.total)} views</b> dan <b>${rp(st.rev/st.total)}</b> per video.`]);
  const net=st.rev-st.cost;
  out.push([net>=0?'good':'warn',`Total pendapatan ${net>=0?'melebihi':'di bawah'} total biaya produksi sebesar <b>${rp(Math.abs(net))}</b> (${Math.round(st.rev/st.cost*100)}% dari biaya).`]);
  const near=list.filter(v=>{const c=calc(v);return !c.ok && c.rev>=0.8*v.cost;});
  if(st.bad) out.push(['warn',near.length?`<b>${near.length} dari ${st.bad}</b> video tidak berhasil sudah mencapai minimal 80% BEP, jadi layak dioptimalkan lebih dulu.`:`Semua ${st.bad} video tidak berhasil masih di bawah 80% BEP.`]);
  if(S.ui.dType==='bulanan'){
    const y=yOf(S.ui.dPer), rows=months().filter(m=>yOf(m)===y).map(m=>({m,r:stat(inMonth(m)).rate})).filter(x=>x.r!=null);
    if(rows.length>1){ const w=rows.reduce((a,b)=>b.r<a.r?b:a); out.push(['warn',`Bulan terlemah tahun ${y}: <b>${perLabel(w.m)}</b> (${pct(w.r)}).`]); }
  }
  return out;
}

function chart(){
  const t=S.ui.dType, p=S.ui.dPer, rate=S.ui.metric==='rate'; let pts=[], sel=-1;
  const val=l2=>{ if(!l2.length) return null; const s=stat(l2); return rate?s.rate:s.rev; };
  if(t==='bulanan'){
    const y=yOf(p); pts=MSHORT.map((l,i)=>{const m=y+'-'+String(i+1).padStart(2,'0'); return {l,full:MONTHS[i]+' '+y,v:val(inMonth(m))}});
    sel=+p.split('-')[1]-1;
  } else if(t==='triwulan'){
    const [y,q]=p.split('-Q'); pts=[1,2,3,4].map(i=>({l:'Tw '+i,full:'Triwulan '+i+' '+y,v:val(inQuarter(y,i))})); sel=+q-1;
  } else {
    const ys=years(); pts=ys.map(y=>({l:y,full:y,v:val(inYear(y))})); sel=ys.indexOf(p);
  }
  if(!pts.length) return '<div class="empty">Belum ada data.</div>';
  const tgt = rate ? S.set.rateTarget : S.set.revTarget*scaleOf(t);
  const mx = rate ? 100 : Math.max(...pts.map(d=>d.v||0), tgt)*1.12;
  const W=600,H=250,L=14,R=62,top=36,base=212,n=pts.length,slot=(W-L-R)/n,bw=Math.min(n===1?70:slot*0.52,36);
  const f=x=>rate?pct(x):jt(x);
  let g=`<defs><linearGradient id="gN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bar-top)"/><stop offset="1" style="stop-color:var(--bar-bot)"/></linearGradient><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bar-sel-top)"/><stop offset="1" style="stop-color:var(--bar-sel-bot)"/></linearGradient></defs><line class="axis" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
  pts.forEach((d,i)=>{
    const cx=L+slot*i+slot/2;
    if(d.v!=null){ const h=(base-top)*d.v/mx;
      g+=`<rect x="${cx-bw/2}" y="${base-h}" width="${bw}" height="${h}" rx="7" fill="url(#${i===sel?'gS':'gN'})"><title>${esc(d.full)}: ${f(d.v)}</title></rect><text class="val" x="${cx}" y="${base-h-6}" text-anchor="middle">${f(d.v)}</text>`;
    } else g+=`<text x="${cx}" y="${base-6}" text-anchor="middle" font-size="10">–</text>`;
    g+=`<text x="${cx}" y="${base+17}" text-anchor="middle" font-size="10.5">${esc(d.l)}</text>`;
  });
  const ty=base-(base-top)*tgt/mx;
  g+=`<line class="tl" x1="${L}" x2="${W-R}" y1="${ty}" y2="${ty}"/><text class="tt" x="${W-R+6}" y="${ty-1}">Target</text><text class="tt" x="${W-R+6}" y="${ty+11}">${f(tgt)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${rate?'Tingkat keberhasilan':'Pendapatan'} per periode">${g}</svg>`;
}

function evalData(){
  const q=S.ui.eq.trim().toLowerCase();
  let list=inMonth(S.ui.ePer).map(v=>({v,c:calc(v)}));
  const all=list;
  if(S.ui.ef==='ok') list=list.filter(x=>x.c.ok); else if(S.ui.ef==='bad') list=list.filter(x=>!x.c.ok);
  if(q) list=list.filter(x=>(x.v.name+' '+(x.v.vid||'')+' '+(x.v.title||'')).toLowerCase().includes(q));
  const k=S.ui.es, dir=S.ui.ed==='asc'?1:-1;
  const key=x=>k==='views'?x.v.views:k==='rev'?x.c.rev:k==='gap'?x.c.gap:x.v.id;
  list.sort((a,b)=>(key(a)-key(b))*dir);
  return {all,list};
}

/* ---------- laporan ---------- */
function recs(y,m){
  const q=qOf(m), sq=stat(inQuarter(y,q)), sy=stat(inYear(y)), g=S.set.growth, rt=S.set.rateTarget;
  let pq, pl; if(q>1){ pq=stat(inQuarter(y,q-1)); pl='Triwulan '+(q-1); } else { pq=stat(inQuarter(String(+y-1),4)); pl='Triwulan 4 '+(+y-1); }
  let prod;
  if(pq.total && sq.rate!=null){
    const d=Math.round((sq.rate-pq.rate)*10)/10;
    prod = d<0 ? `Tingkat keberhasilan turun ${Math.abs(d)} poin dari ${pl}. Tinjau tema atau format video yang gagal sebelum menambah kapasitas.` : d>0 ? `Tingkat keberhasilan naik ${d} poin dari ${pl}. Pertahankan format yang berhasil dan pertimbangkan menambah slot produksinya.` : `Tingkat keberhasilan stabil dibanding ${pl}. Kapasitas produksi dapat dipertahankan.`;
  } else prod='Belum ada triwulan pembanding. Kumpulkan data minimal dua triwulan untuk melihat tren.';
  const nm=months().filter(x=>yOf(x)===y).length, ann=nm?sy.rev/nm*12:0;
  const sug=Math.round(ann*(1+g/100)/5e6)*5e6;
  const target = nm ? `Usulan target pendapatan ${+y+1}: <b>${rp(sug)}</b>, dari ${nm<12?'proyeksi 12 bulan':'realisasi '+y} ${rp(ann)} dengan asumsi pertumbuhan ${g}%.` : 'Belum ada data tahun ini.';
  const tim = sy.rate==null ? 'Belum ada data tahun ini.' : sy.rate>=rt ? `Tingkat keberhasilan tahunan ${pct(sy.rate)} sudah mencapai target ${rt}%. Kinerja tim produksi memenuhi sasaran.` : `Tingkat keberhasilan tahunan ${pct(sy.rate)} masih ${Math.round((rt-sy.rate)*10)/10} poin di bawah target ${rt}%. Perlu evaluasi proses produksi.`;
  return {prod,target,tim};
}
function laporan(){
  const ys=years(), ms=months().filter(m=>yOf(m)===S.ui.rYear), m=S.ui.rMonth;
  if(!m) return `<section class="card glass"><div class="empty">Belum ada data untuk dilaporkan. Tambahkan data di menu Input Data Video.</div></section>`;
  const y=yOf(m), q=qOf(m), sm=stat(inMonth(m)), sq=stat(inQuarter(y,q)), sy=stat(inYear(y)), rc=recs(y,m);
  const top=(l,v,s)=>`<div class="card kpi glass"><div class="l">${l}</div><div class="v num">${pct(v)}</div><div class="s">${s}</div></div>`;
  const r=(l,s)=>`<tr><td>${l}</td><td class="r num">${s.total}</td><td class="r num">${s.ok}</td><td class="r num">${pct(s.rate)}</td><td class="r num">${rp(s.rev)}</td></tr>`;
  let prevQ=null;
  const qrows=[1,2,3,4].map(i=>{ const s=stat(inQuarter(y,i)); const dl=(prevQ&&s.rate!=null&&prevQ.rate!=null)?deltaPts(s.rate,prevQ.rate,'triwulan sebelumnya'):''; if(s.total) prevQ=s;
    return `<tr><td>Triwulan ${i}</td><td class="r num">${s.total||'–'}</td><td style="min-width:170px"><div class="qbar"><div class="prog${s.rate>=S.set.rateTarget?' good':''}"><i style="width:${s.rate||0}%"></i></div><b class="num">${pct(s.rate)}</b></div></td><td>${dl}</td><td class="r num">${s.total?rp(s.rev):'–'}</td></tr>`}).join('');
  return `<section class="card glass"><div class="head"><h2>Laporan DSS</h2><button class="btn" data-act="copy">${ic('copy')}Salin Laporan</button></div>
    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${top('Bulanan',sm.rate,'Periode terpilih')}${top('Triwulan',sq.rate,'Akumulasi 3 bulan')}${top('Tahunan',sy.rate,'Akumulasi tahun')}</div>
    ${S.copy&&S.page==='laporan'?`<textarea class="in copybox" id="copybox" readonly aria-label="Teks laporan">${esc(S.copy)}</textarea>`:''}</section>
  <section class="card glass"><div class="head"><h2>Rekap Periodik</h2><div class="row">
    <select class="sel" id="rYear" data-sel="rYear" aria-label="Tahun">${ys.map(v=>opt(v,v,S.ui.rYear)).join('')}</select>
    <select class="sel" id="rMonth" data-sel="rMonth" aria-label="Bulan">${ms.map(v=>opt(v,perLabel(v),m)).join('')}</select></div></div>
    <div class="tw"><table><thead><tr><th>Periode</th><th class="r">Total Video</th><th class="r">Video Berhasil</th><th class="r">Tingkat Keberhasilan</th><th class="r">Estimasi Pendapatan</th></tr></thead><tbody>
    ${r('Bulanan',sm)}${r('Triwulan '+q,sq)}${r('Tahunan '+y+yLabel(y),sy)}</tbody></table></div></section>
  <section class="card glass"><div class="head"><h2>Perbandingan Triwulan ${y}</h2><span class="note">Garis hijau berarti sudah mencapai target ${S.set.rateTarget}%</span></div>
    <div class="tw"><table><thead><tr><th>Triwulan</th><th class="r">Video</th><th>Tingkat Keberhasilan</th><th>Perubahan</th><th class="r">Pendapatan</th></tr></thead><tbody>${qrows}</tbody></table></div></section>
  <section class="card glass"><div class="head"><h2>Dasar Keputusan Manajemen</h2><span class="note">Rekomendasi berbasis aturan, bukan prediksi</span></div><div class="dec">
    <div><h3>Produksi Konten</h3><p>Gunakan tren bulanan dan triwulan untuk menentukan target dan kapasitas produksi.</p><div class="rec"><small>Rekomendasi</small>${rc.prod}</div></div>
    <div><h3>Target Pendapatan</h3><p>Gunakan laporan tahunan sebagai dasar menetapkan target pendapatan berikutnya.</p><div class="rec"><small>Rekomendasi</small>${rc.target}</div></div>
    <div><h3>Evaluasi Kinerja Tim</h3><p>Gunakan hasil tahunan untuk mengevaluasi pencapaian tim produksi.</p><div class="rec"><small>Rekomendasi</small>${rc.tim}</div></div></div></section>`;
}
const strip = h => h.replace(/<[^>]+>/g,'');
function reportText(){
  const m=S.ui.rMonth; if(!m) return '';
  const y=yOf(m), q=qOf(m), a=stat(inMonth(m)), b=stat(inQuarter(y,q)), c=stat(inYear(y)), rc=recs(y,m);
  const L=(n,s)=>`${n}: ${s.total} video, ${s.ok} berhasil, tingkat keberhasilan ${pct(s.rate)}, estimasi pendapatan ${rp(s.rev)}`;
  return ['Laporan DSS Evaluasi Kinerja Video – Cetakgol IDN',L('Bulanan ('+perLabel(m)+')',a),L('Triwulan '+q+' '+y,b),L('Tahunan '+y+yLabel(y),c),'','Dasar keputusan manajemen:','- Produksi konten: '+strip(rc.prod),'- Target pendapatan: '+strip(rc.target),'- Evaluasi kinerja tim: '+strip(rc.tim)].join('\n');
}

/* ---------- target ---------- */
function targetPage(){
  const nf=(id,l,v,extra='')=>`<div><label for="${id}">${l}</label><input class="in" id="${id}" type="number" value="${v}" ${extra}></div>`;
  return `<section class="card glass"><div class="head"><h2>Pengaturan Target</h2><span class="note">Khusus ${ROLE.manager}</span></div>
    <form id="tgtForm" class="form" style="grid-template-columns:repeat(2,minmax(0,1fr))" novalidate>
      ${nf('tAmb','Ambang Watch Time Berhasil (menit)',S.set.ambang,'min="1"')}
      <div><label for="tCat">Catatan Target</label><input class="in" id="tCat" type="text" value="${esc(S.set.catatan)}"></div>
      ${nf('tRate','Target Tingkat Keberhasilan (%)',S.set.rateTarget,'min="1" max="100"')}
      ${nf('tRev','Target Pendapatan per Bulan (Rp)',S.set.revTarget,'min="1"')}
      ${nf('tGrow','Asumsi Pertumbuhan Target Tahunan (%)',S.set.growth,'min="0" max="200"')}
      <div class="act"><button class="btn" type="submit">Simpan Target</button></div>
    </form>${S.errs.length?`<div class="err" role="alert">${S.errs.join(' ')}</div>`:''}</section>
  <section class="card glass"><div class="head"><h2>Aturan Sistem</h2></div><ul class="rules">
    <li>Pendapatan = (Views ÷ 1.000) × RPM Channel</li>
    <li>Video berhasil jika pendapatan ≥ biaya produksi atau watch time ≥ target.</li>
    <li>Tingkat keberhasilan = video berhasil ÷ total video × 100%</li>
    <li>Rekap triwulan dan tahunan dihitung kumulatif dari data video.</li>
    <li>Target tingkat keberhasilan dan target pendapatan dipakai untuk garis target di grafik, panel Capaian Target, dan rekomendasi.</li></ul></section>`;
}

/* ---------- impor ---------- */
function parsePer(s){
  s=String(s).trim().toLowerCase();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})$/); if(m&&+m[2]>=1&&+m[2]<=12) return m[1]+'-'+String(+m[2]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[-\/](\d{4})$/); if(m&&+m[1]>=1&&+m[1]<=12) return m[2]+'-'+String(+m[1]).padStart(2,'0');
  m=s.match(/^([a-z]+)\s+(\d{4})$/); if(m){ const i=MSHORT.findIndex(x=>m[1].startsWith(x.toLowerCase())); if(i>=0) return m[2]+'-'+String(i+1).padStart(2,'0'); }
  return null;
}
const numOf = s => { const d=String(s).replace(/[^\d]/g,''); return d===''?NaN:+d; };
function doImport(){
  const lines=S.impTxt.split(/\r?\n/).filter(l=>l.trim()); let ok=0; const bad=[];
  lines.forEach((ln,i)=>{
    const sep=ln.includes('\t')?'\t':ln.includes(';')?';':',';
    const c=ln.split(sep).map(x=>x.trim());
    if(i===0 && isNaN(numOf(c[4]||''))) return;
    const per=parsePer(c[3]||''), views=numOf(c[4]||''), wt=numOf(c[5]||''), rpm=c[6]?numOf(c[6]):15000, cost=c[7]?numOf(c[7]):1500000;
    if(!c[0]||!/^[A-Za-z0-9_-]{6,20}$/.test(c[1]||'')||!c[2]||!per||!(views>0)||isNaN(wt)||!(rpm>0)||!(cost>0)){ bad.push(i+1); return; }
    S.videos.push({id:S.nextId++,name:c[0],vid:c[1],title:c[2],per,views,wt,rpm,cost}); ok++;
  });
  if(ok) save();
  S.impMsg = `<b>${ok}</b> baris diimpor.`+(bad.length?` Baris dilewati karena tidak lengkap atau tidak valid: ${bad.slice(0,12).join(', ')}${bad.length>12?' dan lainnya':''}.`:'');
  if(ok && !bad.length) S.impTxt='';
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  if(!S.user){ app.innerHTML=loginView(); return; }
  ensureUi();
  const allowed=navItems().map(n=>n[0]); if(!allowed.includes(S.page)) S.page='dashboard';
  const body = {dashboard,input:inputPage,evaluasi,laporan,target:targetPage}[S.page]();
  app.innerHTML=shell(body);
}
let tt;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3400); }
function copyText(txt,okMsg){
  const fb=()=>{ S.copy=txt; render(); const el=document.getElementById('copybox'); if(el){el.focus();el.select();} toast('Pilih teks lalu salin secara manual.'); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast(okMsg),fb); }catch(err){ fb(); }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='theme'){ cycleTheme(); return; }
  if(a==='eye'){ S.ui.pw=!S.ui.pw; render(); return; }
  if(a==='nav'){ S.page=b.dataset.p; S.errs=[]; S.copy=''; S.ui.confirmAll=false; S.editId=null; S.form={...DEF_FORM}; render(); window.scrollTo(0,0); return; }
  if(a==='logout'){ S.user=null; S.page='dashboard'; S.loginErr=''; S.errs=[]; render(); return; }
  if(a==='metric'){ S.ui.metric=b.dataset.m; render(); return; }
  if(a==='reset'){ S.form={...DEF_FORM}; S.errs=[]; S.editId=null; render(); return; }
  if(a==='edit'){ const v=S.videos.find(x=>x.id===+b.dataset.id); if(!v) return; S.editId=v.id; S.form={name:v.name,vid:v.vid||'',title:v.title||'',per:v.per,views:String(v.views),wt:String(v.wt),rpm:String(v.rpm),cost:String(v.cost)}; S.errs=[]; render(); window.scrollTo(0,0); return; }
  if(a==='del'){ const id=+b.dataset.id; S.videos=S.videos.filter(v=>v.id!==id); if(S.editId===id){S.editId=null;S.form={...DEF_FORM};} save(); render(); toast('Data video dihapus.'); return; }
  if(a==='delall'){ S.ui.confirmAll=true; render(); return; }
  if(a==='delall-no'){ S.ui.confirmAll=false; render(); return; }
  if(a==='delall-yes'){ S.videos=[]; S.ui.confirmAll=false; save(); render(); toast('Semua data video dihapus.'); return; }
  if(a==='more'){ S.ui.show+=25; render(); return; }
  if(a==='restore'){ seedVideos(); save(); render(); toast('Data contoh dipulihkan.'); return; }
  if(a==='imp'){ S.ui.imp=!S.ui.imp; S.impMsg=''; render(); return; }
  if(a==='doimp'){ doImport(); render(); return; }
  if(a==='efilter'){ S.ui.ef=b.dataset.k; render(); return; }
  if(a==='sort'){ const k=b.dataset.k; if(S.ui.es===k) S.ui.ed=S.ui.ed==='asc'?'desc':'asc'; else {S.ui.es=k; S.ui.ed='desc';} document.getElementById('evalTbl').innerHTML=evalTable(); return; }
  if(a==='copy'){ copyText(reportText(),'Laporan disalin ke clipboard.'); return; }
  if(a==='copytable'){
    const {list}=evalData();
    const txt=['Nama Video\tVideo ID\tJudul Video\tViews\tWatch Time (menit)\tPendapatan\tBiaya\tSelisih BEP\tStatus',...list.map(({v,c})=>[v.name,v.vid||'',v.title||'',v.views,v.wt,c.rev,v.cost,c.gap,c.ok?'Berhasil':'Tidak Berhasil'].join('\t'))].join('\n');
    copyText(txt,'Tabel disalin. Tempel langsung ke Excel atau Sheets.');
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){ S.form[t.dataset.f]=t.value; const p=document.getElementById('prev'); if(p) p.innerHTML=previewHtml(); }
  if(t.dataset.l){ S.loginF[t.dataset.l]=t.value; }
  if(t.dataset.imp){ S.impTxt=t.value; }
  if(t.dataset.q==='eq'){ S.ui.eq=t.value; document.getElementById('evalTbl').innerHTML=evalTable(); }
  if(t.dataset.q==='iq'){ S.ui.iq=t.value; S.ui.show=15; document.getElementById('savedTbl').innerHTML=savedTable(); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.l==='r'){ S.loginF.r=t.value; return; }
  const k=t.dataset.sel; if(!k) return;
  if(k==='dType') switchType(t.value);
  else if(k==='dPer') S.ui.dPer=t.value;
  else if(k==='ePer') S.ui.ePer=t.value;
  else if(k==='rYear'){ S.ui.rYear=t.value; S.ui.rMonth=''; }
  else if(k==='rMonth') S.ui.rMonth=t.value;
  S.copy=''; render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='loginForm'){
    const f=S.loginF, u=USERS[f.u.trim().toLowerCase()];
    if(!u || u.pw!==f.p){ S.loginErr='Username atau password salah.'; render(); return; }
    if(u.role!==f.r){ S.loginErr='Hak akses tidak sesuai dengan akun. Pilih "'+ROLE[u.role]+'" untuk akun ini.'; render(); return; }
    S.user=u.role; S.loginErr=''; S.page='dashboard'; render(); return;
  }
  if(id==='vidForm'){
    const f=S.form, er=[];
    if(!f.name.trim()) er.push('Nama video');
    if(!/^[A-Za-z0-9_-]{6,20}$/.test(f.vid.trim())) er.push('Video ID (6–20 huruf, angka, - atau _)');
    if(!f.title.trim()) er.push('Judul video');
    if(!/^\d{4}-\d{2}$/.test(f.per)) er.push('Bulan');
    if(!(Number(f.views)>0)) er.push('Views');
    if(f.wt===''||!(Number(f.wt)>=0)) er.push('Watch time');
    if(!(Number(f.rpm)>0)) er.push('RPM channel');
    if(!(Number(f.cost)>0)) er.push('Biaya produksi');
    S.errs=er;
    if(er.length){ render(); return; }
    const data={name:f.name.trim(),vid:f.vid.trim(),title:f.title.trim(),per:f.per,views:Math.round(+f.views),wt:Math.round(+f.wt),rpm:+f.rpm,cost:+f.cost};
    let v, edited=S.editId!=null;
    if(edited){ v=S.videos.find(x=>x.id===S.editId); Object.assign(v,data); S.editId=null; }
    else { v={id:S.nextId++,...data}; S.videos.push(v); }
    save(); S.form={...DEF_FORM}; render();
    const c=calc(v); toast(`${v.name} ${edited?'diperbarui':'tersimpan'}: ${c.ok?'Berhasil':'Tidak Berhasil'}, pendapatan ${rp(c.rev)}.`); return;
  }
  if(id==='tgtForm'){
    const g=i=>Number(document.getElementById(i).value), er=[];
    if(!(g('tAmb')>0)) er.push('Ambang watch time harus lebih dari 0.');
    if(!(g('tRate')>0&&g('tRate')<=100)) er.push('Target tingkat keberhasilan harus antara 1 dan 100.');
    if(!(g('tRev')>0)) er.push('Target pendapatan harus lebih dari 0.');
    if(!(g('tGrow')>=0)) er.push('Pertumbuhan tidak boleh negatif.');
    S.errs=er; if(er.length){ render(); return; }
    S.set={ambang:Math.round(g('tAmb')),catatan:document.getElementById('tCat').value.trim(),rateTarget:g('tRate'),revTarget:Math.round(g('tRev')),growth:g('tGrow')};
    save(); render(); toast('Target disimpan dan dipakai pada evaluasi berikutnya.');
  }
});

load(); render();
</script>
